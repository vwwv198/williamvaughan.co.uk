    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #666666;            /* 5.5:1 on the background (was #777, 4.3:1) */
            --text-strong: #4a4a4a;
            --background: #fafafa;
            --surface: #ffffff;
            --hover-bg: #666666;
            --hover-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #a8a8a8;
                --text-strong: #d0d0d0;
                --background: #121212;
                --surface: #1e1e1e;
                --hover-bg: #d0d0d0;
                --hover-text: #121212;
                --shadow: rgba(0, 0, 0, 0.4);
            }
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-weight: 300;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;   /* fallback for older browsers */
            min-height: 100dvh;  /* follows Safari's visible area as the toolbars show and hide */
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 200;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .email {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            font-size: 1.125rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            margin-bottom: 0.5rem;
        }

        .email::before {
            content: "✉";
            font-size: 1.25rem;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 0.5rem;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--surface);
            color: var(--text-strong);
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .social-links svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Hover only on devices with a real pointer, so taps on phones don't leave it stuck on */
        @media (hover: hover) {
            .email:hover {
                background-color: var(--hover-bg);
                color: var(--hover-text);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px var(--shadow);
            }

            .social-links a:hover {
                background-color: var(--hover-bg);
                color: var(--hover-text);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px var(--shadow);
            }
        }

        /* Visible outline for keyboard users (Tab) */
        .email:focus-visible,
        .social-links a:focus-visible {
            outline: 2px solid var(--text-strong);
            outline-offset: 3px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--text-strong), transparent);
            margin: 0.5rem auto;
            opacity: 0.3;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 1.5rem;
            }

            .email {
                font-size: 1rem;
                padding: 0.625rem 1.25rem;
            }
        }

        /* Subtle animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container > * {
            /* "both" keeps items hidden during their delay (was "forwards", which made them flash) */
            animation: fadeIn 0.6s ease-out both;
        }

        .container > *:nth-child(2) {
            animation-delay: 0.1s;
        }

        .container > *:nth-child(3) {
            animation-delay: 0.2s;
        }

        .container > *:nth-child(4) {
            animation-delay: 0.3s;
        }

        @media (prefers-reduced-motion: reduce) {
            .container > * {
                animation: none;
            }

            .email,
            .social-links a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>WILLIAM VAUGHAN</h1>

        <div class="divider" aria-hidden="true"></div>

        <a href="mailto:wv@williamvaughan.co.uk" class="email">
            wv@williamvaughan.co.uk
        </a>

        <div class="social-links">
            <a href="mailto:wv@williamvaughan.co.uk" aria-label="Email" title="Email">

                </svg>
            </a>
            <a href="https://www.linkedin.com/in/vaughan198" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>

        </div>
    </main>
</body>
</html>
